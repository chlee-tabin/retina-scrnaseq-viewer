plot_settings:
  height: '85vh'  # Back to viewport-relative
  min_height: 400  # Minimum height in pixels
  max_height: 1000  # Maximum height in pixels
  marker_size: 5
  opacity: 0.7
  colorscales:
    continuous: 'viridis'
    categorical: 'Set3'
  categorical_plot:
    base_height: 300
    base_width: 350
    max_rows: 4
    max_cols: 3  # Maximum columns before wrapping
  responsive_breakpoints:
    small: 768    # Mobile devices
    medium: 1024  # Tablets
    large: 1440   # Desktop
  show_opacity_control: true

metacell_settings:
  bin_size: 50
  smoothing: 1.0

layout_settings:
  sidebar_width: 3
  main_width: 9 